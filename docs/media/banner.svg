    <path d="M926 202H1058M926 223H988" fill="none"/>
    <rect x="935" y="119" width="178" height="70" rx="12" fill="#d98c74"/>
    <path d="M958 143H1090M958 164H1021" fill="none"/>
  </g>
  <text x="998" y="334" text-anchor="middle" fill="#292622" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24">⌘ ⇧ V</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">CleverClipboard</title>
  <desc id="desc">Clipboard history and Smart Paste for macOS. Three overlapping clipboard cards, with Command Shift V below.</desc>
  <rect width="1200" height="360" rx="24" fill="#e8e0d2"/>
  <g fill="none" stroke="#d0c5b3" stroke-width="1">
    <path d="M0 300H1200M780 0V360"/>
    <circle cx="1020" cy="178" r="140"/>
    <circle cx="1020" cy="178" r="112"/>
  </g>
  <g fill="#24211e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="54" y="62" font-size="15" letter-spacing="3">MACOS · PERSONAL PROJECT</text>
    <text x="50" y="158" font-size="76" font-weight="750" letter-spacing="-4">CleverClipboard</text>
    <text x="54" y="209" font-size="24">Clipboard history and Smart Paste.</text>
    <text x="54" y="332" font-size="15">SWIFT + SWIFTUI</text>
    <text x="742" y="332" font-size="15" text-anchor="end">MACOS 14+ · APPLE SILICON</text>
